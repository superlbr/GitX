[package]
name = "uiprobe"
version = "0.1.0"
edition = "2021"

# 单日 spike：只为回答 PROCESS.md 里那两条判据（CJK+emoji 渲染、macOS 拼音输入），
# 不作为产品代码。
[dependencies]
eframe = "0.37"

[profile.dev]
opt-level = 1

# 彩色 emoji（COLR/PNG 位图）需要 vello_cpu 的字形光栅化，默认不开。
[dependencies.epaint]
version = "0.37"
features = ["color_fonts"]
